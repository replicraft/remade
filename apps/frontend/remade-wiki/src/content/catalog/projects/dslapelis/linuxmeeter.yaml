summary: Voicemeeter-style PipeWire mixing with channel strips, EQ, dynamics and virtual microphone buses.
description: A native PipeWire audio mixer targeting Voicemeeter-style strips, routing and buses on Linux. Captures hardware and application sources, applies LSP gate/compressor/EQ/limiter chains, routes to hardware outputs or virtual microphones, and provides metering, mute/solo, profile persistence and a tray interface.
license: GPL-3.0-or-later
docs: https://github.com/dslapelis/linuxmeeter#readme
limitations: Requires PipeWire 1.0 or later, WirePlumber, LSP LV2 plugins and the GTK/WebKit tray/UI dependencies. Not a Windows driver or a complete Voicemeeter preset/API replacement. Virtual devices disappear when the application exits.
