description: Lookout reimplements Outlook-style mail, calendar, contacts and tasks in a native GNOME application built with Rust and GTK 4. It supports IMAP/SMTP mail, CalDAV calendars, CardDAV contacts, GNOME Online Accounts, full-text mail search and rich-text composition.
