slug: lookout
name: Lookout
authors: [gavindi]
repository: https://github.com/gavindi/lookout
originals: [microsoft-outlook]
category: productivity
languages: [Rust]
platforms: [Linux]
status: experimental
compatibility: partial
summary: "Outlook-style mail, calendar, contacts and tasks in a native GNOME app with IMAP, SMTP, CalDAV and CardDAV."
description: "An Outlook-style mail, calendar, contacts and tasks client for GNOME, built with Rust and GTK 4. Supports IMAP/SMTP, GNOME Online Accounts and Microsoft 365 integration, with full-text search and rich-text composition. Calendars and contacts use CalDAV/CardDAV or Microsoft accounts; tasks integrate with Google Tasks and Microsoft To Do."
license: GPL-3.0-or-later
website: https://lookout-mail.com/
docs: https://github.com/gavindi/lookout#readme
limitations: Compatibility is maintainer-reported; full Outlook feature or file-format compatibility is not claimed. Targets the Linux GNOME desktop with GTK 4, libadwaita and WebKitGTK.
