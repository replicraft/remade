# Suggested in https://github.com/replicraft/remade/issues/44.
# Accepted with maintainer approval as a broader alternative.
slug: mt-sync
name: Mt. Sync
authors: [gavindi]
repository: https://github.com/gavindi/MtSync
originals: [rcloneview, goodsync]
category: productivity
languages: [C++]
platforms: [Linux]
status: experimental
compatibility: partial
description: A broader RcloneView and GoodSync alternative built as a native GTK4/libadwaita frontend to rclone. Offers remote configuration, dual-pane browsing and comparison, copy, move, sync and mount jobs, scheduling, local file watching and a persistent background daemon. rclone provides the storage backends and transfer engine.
license: GPL-2.0
docs: https://github.com/gavindi/MtSync#readme
limitations: Targets Linux/GNOME workflows. Native GoodSync or RcloneView job/configuration import and full behavioral compatibility are not documented. Storage-provider support and transfer behavior depend on rclone. File-watch triggers monitor local source directories, not remote sources; scheduled jobs remain available for remotes.
summary: "Browse, compare, mount and sync remote storage through a native GNOME frontend to rclone."
