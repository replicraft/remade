summary: "Design and sew garment patterns in 2D and 3D, following Marvelous Designer and CLO workflows."
description: "Independent garment-editor and cloth-simulation prototype targeting Marvelous Designer and CLO 3D workflows. Provides 2D polygon and Bezier drafting, linked 2D/3D sewing with partial and multi-edge seams, 3D arrangement and simulation, local project saving and recovery, static avatar imports and limited DXF/SVG pattern-outline imports."
license: MIT
docs: https://github.com/erythrofr/ClothCraft/blob/main/README.md
limitations: "Research prototype; Windows is the main development platform, with macOS and Linux acceptance testing pending. No native Marvelous/CLO files or verified parity. Simulation uses hybrid GPU/CPU VBD with OGC contact; friction, material calibration and dense-mesh performance need work. Industrial DXF-AAMA/ASTM, animated avatars, PDF printing and grading remain planned."
