limitations: Early alpha with an English UI; only Windows is exercised. No native Marvelous/CLO files or verified parity. Contact detection remains CPU-based. Friction, animated avatars, calibrated fabrics, partial sewing and most industry interchange are unfinished. No autosave or recovery; export overwrites fixed filenames.
summary: "Design and sew garment patterns in 2D and 3D, following Marvelous Designer and CLO workflows."
