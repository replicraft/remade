docs: https://github.com/erythrofr/ClothCraft/blob/main/README.md
limitations: Early alpha with a French UI; Windows is the only exercised desktop platform. No native Marvelous/CLO file support or verified feature/simulation parity. Contact detection remains CPU in the hybrid GPU solver. Friction, animated avatars, calibrated fabrics, interactive partial sewing and most industry formats are not implemented.
