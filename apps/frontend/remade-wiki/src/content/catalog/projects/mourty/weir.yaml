summary: Voicemeeter-style Linux mixing with per-output routing, voice processing, virtual devices and recording.
description: A PipeWire mixer targeting Voicemeeter-style strips, faders, buses and separate monitor/stream mixes on Linux. Adds virtual playback/microphone devices, suppression, gate, compression, EQ, ducking, limiting, delay, surround routing, hotkeys and scenes. External effect applications can be routed in and back; optional recording uses bundled codec components.
license: MIT
docs: https://github.com/Mourty/Weir#readme
limitations: Linux/PipeWire application, not a Windows driver or full Voicemeeter settings/API replacement. Device and global-hotkey behavior depends on the desktop and audio setup. Noise suppression and MP3 recording retain separate BSD/LGPL component terms.
