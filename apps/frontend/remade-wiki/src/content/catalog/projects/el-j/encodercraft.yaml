summary: Media Encoder-style batch transcoding with queues, presets, watch folders, source decoding and CLI/MCP automation.
description: An Adobe Media Encoder-style application with queue management, presets, watch folders, a desktop interface and CLI/MCP automation. Uses craft-libs and FilmCraft media components to decode source video, audio and image sequences, transform frames and stream them to encoders and muxers. Includes scaling, trimming, frame-rate conversion, overlays, captions and audio processing.
license: "MIT OR Apache-2.0"
docs: "https://github.com/el-j/encoderCraft#readme"
limitations: Alpha; source-media decoding and export are connected, but broad codec, container and platform behavior remain maintainer-reported rather than independently verified. Native AME project and Adobe Dynamic Link compatibility are not established. The README also uses production-ready wording; that does not establish full Media Encoder fidelity.
