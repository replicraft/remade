# Compatibility and independence are maintainer-reported in the upstream README.
slug: honeydew
name: Honeydew
authors: [daijro]
repository: https://github.com/daijro/honeydew
originals: [fl-studio-mobile]
category: creative
languages: [Rust]
platforms: [Windows, macOS, Linux, Web]
status: experimental
compatibility: partial
description: Independent Rust implementation of FL Studio Mobile for desktop and browser, with a playlist, piano roll, drum editor, mixer, instrument and effects racks, automation, chords and audio editing. The maintainer demonstrates opening FL Studio Mobile demo projects as .flm files. Bundles separately licensed replacement sounds.
license: GPL-3.0-or-later
website: https://playground.daijro.dev/honeydew/
docs: https://github.com/daijro/honeydew#readme
limitations: Full FL Studio Mobile parity is not independently verified; native Android and iOS builds are not documented. Original samples and presets are not bundled; desktop users can import them from their own licensed copy. The browser version cannot import original content, and some shortcuts remain controlled by the browser.
