slug: mister-download-manager
name: Mister Download Manager
authors: [anefzaoui]
repository: https://github.com/anefzaoui/misterdownloadmanager
originals: [internet-download-manager]
category: productivity
languages: [Rust]
platforms: [Windows, Linux, macOS]
status: experimental
compatibility: partial
summary: "IDM-style segmented downloads with resume, browser integration, queues, scheduling and torrent support."
description: "A Rust download manager targeting Internet Download Manager's interface and workflows. Provides segmented transfers, resume, download categories, queues, scheduling and browser integration through its own extension and native-messaging host. Adds BitTorrent and magnet downloads, seeding, video-download helpers, link grouping, archive extraction, and CLI/MCP controls."
license: GPL-3.0-or-later
docs: https://github.com/anefzaoui/misterdownloadmanager#readme
limitations: "Early software; macOS builds are experimental and have not been tried on Mac hardware by the maintainer. Linux screen readers and Flatpak browsers are unsupported. Packages are unsigned. Browser capture requires its own integration; video and archive helpers depend on external programs. IDM settings and download-state interchange are not established."
website: https://misterdownloadmanager.com/
