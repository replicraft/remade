status: alpha
compatibility: partial
description: A C++23 RTS engine for macOS with a native Metal renderer. Loads Forged Alliance maps, models, blueprints and sound banks from a retail installation. Implements skirmish simulation with fixed-point arithmetic, command-log replay and a Lua adapter for FAF AI. A separate launcher runs Beyond All Reason using the upstream Recoil engine.
license: GPL-3.0-or-later; GPL-2.0-or-later components
limitations: Work in progress; no multiplayer or full gameplay parity. Needs a retail Forged Alliance install and pinned FAF AI scripts. Upstream documents a golden replay check diverging from its saved baseline; deterministic replay is not independently verified. The separate BAR launcher uses upstream Recoil and is not a reimplementation.
summary: Native macOS engine for Forged Alliance skirmishes, using game data from an existing installation.
