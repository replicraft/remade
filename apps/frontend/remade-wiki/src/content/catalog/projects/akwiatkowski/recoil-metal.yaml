slug: recoil-metal
name: recoil-metal
authors: [akwiatkowski]
repository: https://github.com/akwiatkowski/recoil-metal
originals: [supreme-commander-forged-alliance]
category: games
languages: [C++, Objective-C++, Lua]
platforms: [macOS]
status: alpha
compatibility: partial
description: "New C++23 RTS engine for macOS that renders through Metal and loads Supreme Commander: Forged Alliance maps, models, blueprints and sound banks from a retail install. Its fixed-point simulation replays deterministically and runs FA's own Lua AI unmodified. A separate launcher runs Beyond All Reason on the open-source Recoil engine with a Metal renderer."
license: GPL-3.0-or-later
limitations: "Work in progress: skirmishes play to victory, but gameplay parity is incomplete. Requires a Supreme Commander: Forged Alliance installation for game data, and the updated AI Lua code from Forged Alliance Forever (FAF), fetched at a pinned commit, for AI opponents. Multiplayer is not supported. The Beyond All Reason launcher uses the upstream Recoil engine and is not a reimplementation."
