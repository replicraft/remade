# Scope and limitations are maintainer-reported in the README and parity assessment.
slug: substancecraft
name: SubstanceCraft
authors: [lyraedan]
repository: https://github.com/Lyraedan/SubstanceCraft
originals: [adobe-substance-3d-painter]
category: creative
languages: [Rust]
platforms: [Linux, macOS, Windows]
status: experimental
compatibility: partial
description: An independent Rust implementation of Painter-style 3D texture painting, with glTF and OBJ import, PBR previews, non-destructive layers and masks, procedural generators, mesh-map baking and packed texture export. Supports a native project format, command-line automation and MCP.
license: MIT OR Apache-2.0
docs: https://github.com/Lyraedan/SubstanceCraft/blob/main/docs/target-app-parity.md
limitations: Early development; compatibility is maintainer-reported. Painter project-file compatibility is not documented. Native pen pressure, UDIM-aware painting, smart materials and masks, anchor points and layer instancing remain incomplete. GPU compositing is limited, and signed release packaging is not available.
summary: "Painter-style 3D texture painting with layered PBR materials, masks, generators and mesh-map baking."
