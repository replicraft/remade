summary: LightBurn-style laser design and control with vector editing, material settings, nesting and 3D assembly
  previews.
description: Laser design and machine-control software targeting LightBurn-style engraving and cutting workflows.
  Combines vector/image editing, material libraries, calibration, job previews and direct control of GRBL, FluidNC,
  grblHAL, Marlin and Smoothieware devices. Imports supported LBRN2 projects and common artwork formats, with parametric
  parts, nesting, STL/OBJ construction, 3D assembly previews and MCP automation.
