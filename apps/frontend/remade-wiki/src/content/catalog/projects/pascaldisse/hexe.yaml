summary: "Houdini-style procedural geometry with a Rust SOP engine, node graphs, desktop viewport and CLI."
description: "Targets Houdini's procedural geometry workflows with a Rust SOP engine, node graphs, a Tauri desktop viewport and a CLI. Implements partial SOP, VEX and HIP support and geometry exchange. Experimental Endorphin support reads ENS scenes and simulates authored events, ragdolls and a small set of re-authored behavior controllers."
license: Unlicensed
docs: https://github.com/pascaldisse/hexe/blob/main/STATUS.md
limitations: "SOP, VEX and HIP coverage is partial. Endorphin behavior networks and constraint attachments remain unsupported; only a small controller subset is re-authored, with solver and visual fidelity unverified. macOS is the documented app build. No project-level license file; package metadata declares MIT OR Apache-2.0, pending clarification."
