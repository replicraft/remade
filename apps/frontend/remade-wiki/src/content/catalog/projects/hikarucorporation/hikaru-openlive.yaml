status: experimental
compatibility: partial
summary: Bitwig- and Ableton-style live production with a session matrix, clip launching, arranger and wavetable
  synthesis.
description: A Rust DAW targeting Bitwig Studio and Ableton Live performance workflows. Combines scene-based clip
  launching and an arranger timeline with a CPAL audio engine, sample-accurate sequencing, effect racks and OpenWavetable
  synthesis. Includes MIDI/piano-roll editing, native project formats and command-line tooling, with ongoing work
  on automation, controllers and production workflows.
license: AGPL-3.0-or-later
docs: https://github.com/hikarucorporation/hikaru-openlive#readme
limitations: Actively developed; the piano roll is buggy and several workflows remain incomplete. Full Bitwig/Ableton
  project, device and plug-in compatibility is not established. Linux builds are documented; Windows cross-compilation/Wine
  testing and the FreeBSD target do not establish equivalent native runtime coverage. File-format and audio-driver
  libraries use LGPL-3.0-or-later.
