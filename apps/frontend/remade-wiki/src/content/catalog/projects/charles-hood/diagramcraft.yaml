# Scope and limitations are maintainer-reported in the repository documentation.
slug: diagramcraft
name: MisterDiagram
authors: [charles-hood]
repository: https://github.com/MisterDiagram/MisterDiagram
originals: [microsoft-visio]
category: productivity
languages: [Rust]
status: experimental
compatibility: partial
summary: "Read, render and edit Visio files through a headless Rust engine, command line and MCP server."
description: A headless implementation of Visio package formats and ShapeSheet formulas, formerly DiagramCraft. Reads diagrams, stencils and templates, renders PNG, SVG and PDF, and writes and authors drawings with glued connectors and routing. Exposes CLI commands and an MCP server.
license: MIT OR Apache-2.0
website: https://misterdiagram.com
docs: https://github.com/MisterDiagram/MisterDiagram#readme
limitations: Pre-alpha; no GUI is provided or planned. Macro-enabled files discard VBA. File fidelity and Visio comparisons are maintainer-reported. Text wrapping, EMF+ images, compound line patterns, connector rendering and some save serialization remain incomplete.
