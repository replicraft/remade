docs: "https://github.com/asad-albadi/PixelCraft#readme"
limitations: "Early alpha. Published v0.1.0 assets cover Linux; Windows installer workflows are documented but a released installer was not verified. Full ICC preview, arbitrary Aseprite Lua APIs, original themes and some ASE encodings or tileset arrangements are unsupported. Other platforms remain unvalidated."
