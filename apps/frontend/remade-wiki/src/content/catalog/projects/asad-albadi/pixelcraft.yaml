summary: "Aseprite-style pixel art and animation with ASE file exchange, tilemaps, palettes and independent Lua extensions."
description: "A standalone pixel-art editor with layered drawing, frame animation, tilemaps, palettes and native project storage. Imports and exports supported ASE/ASEPRITE documents using the published format specification. Includes an embedded Lua runtime and an independent extension interface."
