originals: [ibm-spss-statistics]
category: engineering
languages: [Rust]
platforms: [Windows, Linux, macOS]
status: experimental
compatibility: partial
summary: "SPSS-style data and variable editors, statistical procedures, syntax execution and structured output tables."
description: "A Rust statistical application targeting IBM SPSS Statistics workflows. Combines data and variable views with metadata, missing-value handling, transformations, descriptive statistics, t-tests, ANOVA, correlations, regression and other implemented procedures. Imports CSV/TSV, spreadsheets and SPSS SAV/ZSAV data, executes supported SPSS-style syntax, and presents structured tables with TSV, HTML and text output. Provides local MCP/IPC automation."
license: MIT OR Apache-2.0
docs: https://github.com/kobaltgit/StatCraft#readme
limitations: Partial SPSS syntax, data-file and procedure coverage; complete project/output interchange and numerical
  parity are not established. Charting, PDF/LaTeX report export, survival analysis and other advanced procedures
  remain unfinished.
