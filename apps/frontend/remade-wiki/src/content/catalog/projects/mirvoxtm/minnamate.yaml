description: An independent Animate-style editor that opens FLA files and unpacked XFL folders. Supports basic drawing, selection, symbols, frame editing, classic tweens and color effects, with undo and movie testing. Command-line tools render frames to PNG and publish SWF movies that the maintainer reports playing in Ruffle.
license: Unlicensed
docs: https://github.com/mirvoxtm/minnamate#readme
limitations: No project license grant is declared. Early implementation; masks, gradients, bitmaps, shape and motion tweens, most button states and ActionScript are not implemented. Unsupported document features are reported as warnings. Desktop instructions document Windows only.
