slug: photonforge
name: PhotonForge
authors: [babisque]
repository: https://github.com/babisque/PhotonForge
originals:
- lightburn
category: engineering
languages:
- Rust
status: experimental
compatibility: partial
summary: LightBurn-style SVG layout, per-layer cut settings, toolpath preview and G-code generation, initially targeting GRBL.
description: "An early Rust implementation of LightBurn-style laser layout workflows, initially targeting GRBL. Its layered workspace separates geometry, SVG import, G-code generation, device communication and an egui GUI. Tools arrange and edit shapes, configure per-layer cuts, preview toolpaths and save G-code, with undo/redo. Read-only GRBL connection code is present; machine control and job streaming remain planned."
license: GPL-3.0-or-later
docs: https://github.com/babisque/PhotonForge#readme
limitations: "Experimental; GUI workflows and G-code simulation lack recorded manual verification. Read-only GRBL access has not been tested on hardware. Machine control/streaming, raster engraving and native project files remain planned; no LightBurn project-file interoperability is documented."
