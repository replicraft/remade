# Suggested in https://github.com/replicraft/remade/issues/8.
slug: lightcraft-classic
name: "Chromaforge"
authors: [emmertex]
repository: "https://github.com/emmertex/chromaforge"
browser_url: https://playground.daijro.dev/lightcraft-classic/
originals: [adobe-lightroom]
category: creative
languages: [Rust]
platforms: [Linux, macOS, Windows, FreeBSD, Web, Android]
status: experimental
compatibility: partial
summary: "Lightroom Classic-style photo catalogs and non-destructive RAW development, built on LightCraft."
description: "Chromaforge, formerly LightCraft Classic, is a downstream fork of ArtCraft's LightCraft focused on Lightroom Classic workflows. Provides a seven-module workspace, non-destructive RAW development, photo catalogs, masking and Immich integration."
license: MIT AND Apache-2.0
docs: "https://github.com/emmertex/chromaforge#readme"
limitations: "Compatibility is incomplete and maintainer-reported. Camera-color calibration and verification across camera models remain incomplete. AI model downloads are optional; sky masks are heuristic and denoise quality is unverified. HDR display covers only the loupe, and video editing is limited to global adjustments. Android support is early."
