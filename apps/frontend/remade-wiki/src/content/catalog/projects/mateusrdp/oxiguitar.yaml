# Current implementation scope follows the upstream M1 status, not its broader introduction.
slug: oxiguitar
name: OxiGuitar
authors: [mateusrdp]
repository: https://github.com/mateusrdp/oxiguitar
originals: [guitar-pro]
category: creative
languages: [Rust]
platforms: [Windows, macOS, Linux]
status: experimental
compatibility: partial
description: Early Rust implementation targeting Guitar Pro's tablature and notation workflows. Its M1 desktop viewer opens Guitar Pro 3 through 8 files, displays standard notation and tablature in multiple layouts and exports PDF. Editing, playback and broader interchange are subsequent milestones.
license: GPL-3.0-only
docs: https://mateusrdp.github.io/oxiguitar/
limitations: Early M1 viewer; editing and playback remain planned despite broader wording in the README introduction. MuseScore, MusicXML, ABC and MIDI interchange await plugins. Platform coverage is maintainer-reported. Own code is GPL-3.0-or-later; distributed MuseScore-derived code requires GPL-3.0-only.
