slug: cliprecorder
name: ClipRecorder
repository: https://github.com/By183/ClipRecorder
originals: [nvidia-shadowplay]
category: creative
languages: [C++]
platforms: [Windows]
status: experimental
compatibility: partial
description: Reimplements ShadowPlay-style instant replay using Windows screen capture, DirectX 11 and Media Foundation. Buffers hardware-encoded H.264 video with system audio and optional microphone input, then saves the recent recording as MP4 through a global hotkey. Uses generic GPU encoders rather than an NVIDIA-specific SDK.
license: Unlicensed
docs: https://github.com/By183/ClipRecorder#readme
limitations: Requires Windows 10 20H1 or later and a compatible hardware H.264 encoder. Targets replay capture, with no claim of complete ShadowPlay overlay, automatic highlights, HDR or AV1 parity. Performance and recording behavior are maintainer-reported. No application-wide license grant is documented; bundled dependencies have separate licenses.
summary: "Save recent Windows screen recordings as MP4 with hardware encoding, system audio and a hotkey."
