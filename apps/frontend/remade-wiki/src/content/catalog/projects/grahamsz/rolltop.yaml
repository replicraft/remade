slug: rolltop
name: Rolltop
authors: [grahamsz]
repository: https://github.com/grahamsz/rolltop
originals: [gmail]
category: productivity
languages: [Go, TypeScript, Kotlin]
platforms: [Web, Android]
status: "experimental"
compatibility: partial
summary: "Self-hosted email with Gmail-style search, threaded conversations, snooze and multiple IMAP accounts."
description: >-
  Self-hosted email client offering Gmail-style search operators, threaded
  conversations, snooze, and keyboard shortcuts. Mirrors multiple IMAP accounts
  into local storage with full-text search, a web UI, offline access to recently
  viewed mail, and an Android app.
license: "Unlicensed"
website: https://rolltop.app/
docs: https://github.com/grahamsz/rolltop#readme
limitations: "Requires a self-hosted server and existing IMAP/SMTP accounts. A broader Gmail alternative, not a Gmail API implementation; offline access covers previously viewed mail. Upstream proposes AGPL-3.0-or-later but provides no project license file or clear current license grant. Stable maturity is not established."
