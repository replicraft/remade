# Scope and limitations are based on the repository README; compatibility is not independently verified.
slug: lightcraft
name: LightCraft
authors: [storytold]
repository: https://github.com/storytold/lightcraft
browser_url: https://playground.daijro.dev/lightcraft/
originals: [adobe-lightroom]
category: creative
languages: [Rust]
platforms: [Linux, macOS, Windows, FreeBSD, Web]
status: alpha
compatibility: partial
summary: "Lightroom-style photo management with non-destructive RAW development, adjustments and masking."
description: "An independent Lightroom-style photography application by ArtCraft with photo-library organization, non-destructive adjustments, RAW development and masking. Provides crop and lens tools, local edits, presets, batch processing and image export, using the same Rust processing engine on desktop and in the browser. CLI commands, a JSON control channel and MCP expose library and development workflows."
license: MIT OR Apache-2.0
website: https://getartcraft.com/apps/lightcraft
discord_server: https://discord.gg/artcraft
limitations: "Alpha; camera color and render fidelity are not measured against Lightroom. Some compressed RAW variants remain preview-only, and lens profiles are limited. Several AI masks are heuristics; denoise models have separate terms. HDR, video and Classic Print, Book and Map workflows have gaps. Windows/macOS and GPU behavior need broader qualification."
