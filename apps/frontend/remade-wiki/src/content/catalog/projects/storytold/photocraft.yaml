# Scope, status and limitations are maintainer-reported in the repository README.
slug: photocraft
name: PhotoCraft
authors: [storytold]
repository: https://github.com/storytold/photocraft
browser_url: https://playground.daijro.dev/photocraft/
originals: [adobe-photoshop]
category: creative
languages: [Rust]
platforms: [Linux, macOS, Windows, FreeBSD, Web]
status: alpha
compatibility: partial
summary: "Photoshop-style image editing with layers, adjustments, selections and layered PSD files."
description: "PhotoCraft by ArtCraft independently implements Photoshop-style image editing with brushes, layers and masks, adjustments, selections, filters, text and layered PSD/PSB documents. Supports high-bit-depth images, CMYK/Lab workflows and common raster formats. The native desktop and browser interfaces share editing commands with the CLI, JSON control channel and MCP server; Photoshop interchange remains partial."
license: MIT OR Apache-2.0
website: https://getartcraft.com/apps/photocraft
discord_server: https://discord.gg/artcraft
limitations: "Alpha; PSD files written by PhotoCraft are not yet reliably accepted by Photoshop. Menu coverage does not establish format or rendering fidelity. Typography, AI features, professional workflows and Photoshop plug-in compatibility remain incomplete; native tablet and platform behavior have differing validation coverage."
