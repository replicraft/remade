# Scope and limitations are based on the repository README; compatibility is not independently verified.
slug: gridcraft
name: GridCraft
authors: [storytold]
repository: https://github.com/storytold/gridcraft
browser_url: https://playground.daijro.dev/gridcraft/
originals: [microsoft-excel]
category: productivity
languages: [Rust]
platforms: [Linux, macOS, Windows, FreeBSD, Web]
status: alpha
compatibility: partial
summary: "Excel-style spreadsheets with formulas, formatting, tables, charts and XLSX file support."
description: "An independent Excel-style spreadsheet application by ArtCraft with formulas, incremental workbook recalculation, dynamic arrays, formatting, tables, charts and XLSX reading/writing. Includes conditional formats, validation, PivotTable workflows, Solver and analysis tools; imports supported legacy XLS content. Desktop and browser interfaces share commands with the CLI, JSON control channel and MCP server."
license: MIT OR Apache-2.0
discord_server: https://discord.gg/artcraft
limitations: Alpha; compatibility is maintainer-reported. XLSX fidelity on real-world files, very large workbooks, multithreaded recalculation, chart depth, multilingual text and legacy XLS import still need work.
