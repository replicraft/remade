# Scope and limitations are based on the repository README; compatibility is not independently verified.
slug: wordcraft
name: WordCraft
authors: [storytold]
repository: https://github.com/storytold/wordcraft
browser_url: https://playground.daijro.dev/wordcraft/
originals: [microsoft-word]
category: productivity
languages: [Rust]
platforms: [Linux, macOS, Windows, FreeBSD, Web]
status: alpha
compatibility: partial
summary: "Word-style document editing with styles, tables, review tools, DOCX files and PDF export."
description: "An independent Word-style document editor by ArtCraft with ribbon workflows, paragraph styles, tables, review tools, track changes, references and mail merge. Reads/writes DOCX, ODT, RTF, HTML, Markdown, LaTeX and plain text, opens supported legacy DOC files and exports PDF. Desktop and browser interfaces share document commands with the CLI, JSON control channel and MCP server; Word layout and format fidelity remain partial."
license: MIT OR Apache-2.0
website: https://getartcraft.com/apps/wordcraft
discord_server: https://discord.gg/artcraft
limitations: "Alpha; real-world DOCX round-trip and page-layout fidelity against Word remain unverified. Pagination, native ink rendering, embedded objects, proofing languages and some legacy formats have gaps. Upstream reports platform-specific crashes and freezes. Menu coverage does not establish full Word compatibility."
