slug: vectorcraft
name: VectorCraft
authors: [storytold]
repository: https://github.com/storytold/vectorcraft
browser_url: https://playground.daijro.dev/vectorcraft/
originals: [adobe-illustrator]
category: creative
languages: [Rust]
platforms: [Linux, macOS, Windows, FreeBSD, Web]
status: alpha
compatibility: partial
summary: "Illustrator-style vector art with paths, artboards, typography and SVG, PDF and compatible AI files."
description: "VectorCraft by ArtCraft independently implements Illustrator-style vector illustration with paths, artboards, typography, shapes, curve booleans, gradients, symbols and effects. Reads/writes SVG and PDF and supports PDF-compatible AI files. Provides desktop and browser editing plus undoable commands exposed through CLI, JSON control and MCP interfaces. Native Illustrator interchange remains partial."
license: MIT OR Apache-2.0
website: https://getartcraft.com/apps/vectorcraft
discord_server: https://discord.gg/artcraft
limitations: Under active development with incomplete Illustrator parity. AI support targets PDF-compatible files; full compatibility is not claimed.
