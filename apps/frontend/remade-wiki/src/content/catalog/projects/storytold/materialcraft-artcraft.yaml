summary: Build procedural PBR materials with node graphs, primitive editing, SBS projects and live 2D/3D previews.
description: A Rust node-based material editor offering Substance Designer-style workflows. Provides primitive and function graphs, procedural noises and patterns, live 2D/3D previews and texture-map export. Saves native SBS projects with adjacent resources or self-contained .mcraft packages. Includes CLI rendering, automation and material export for TextureCraft.
license: MIT OR Apache-2.0
