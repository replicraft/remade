website: https://getartcraft.com/apps/materialcraft
browser_url: https://playground.daijro.dev/head/materialcraft/
discord_server: https://discord.gg/artcraft
limitations: Under active development, currently focused on primitive editing and native SBS save/load. Reference-app rendering parity and full SBS library loading remain pending. The previous Rust procedural library was removed.
