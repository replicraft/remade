# Scope and limitations are based on the repository README; compatibility is not independently verified.
slug: effectcraft
name: EffectCraft
authors: [storytold]
repository: https://github.com/storytold/effectcraft
browser_url: https://playground.daijro.dev/effectcraft/
originals: [adobe-after-effects]
category: creative
languages: [Rust]
platforms: [Linux, macOS, Windows, FreeBSD, Web]
status: alpha
compatibility: partial
summary: "After Effects-style compositing with layered animation, keyframes, expressions, effects and rendering."
description: "An independent After Effects-style compositor by ArtCraft with compositions, layered animation, keyframes, expressions, effects and rendering. Supports shape and text animation, masks, nested compositions and time remapping. Uses readable .ecproj project files and imports/exports Lottie. The desktop interface, CLI, JSON control channel and MCP server share the same command engine."
license: MIT OR Apache-2.0
discord_server: https://discord.gg/artcraft
website: https://getartcraft.com/apps/effectcraft
limitations: Cannot open AEP or AEPX projects or run After Effects plug-ins. Render behavior has not yet been systematically compared with After Effects.
