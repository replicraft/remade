slug: nootion
name: Nootion
authors: [btronquo]
repository: https://github.com/btronquo/Nootion
originals: [notion]
category: productivity
languages: [TypeScript]
platforms: [Web]
status: experimental
compatibility: partial
summary: Self-hosted Notion-style pages and databases with collaborative editing, formulas, automations and Notion imports.
description: Self-hosted Notion-style pages, wikis and databases with collaborative block editing, comments, sharing and roles. Supports typed properties, relations, rollups, formulas, six database views, automations, recurring templates and widgets. Imports Notion pages and databases through its API and exports Markdown, CSV and JSON. Includes offline PWA editing, REST and MCP access, plugins and backups in a single Docker deployment.
license: AGPL-3.0-only
docs: https://github.com/btronquo/Nootion/blob/develop/docs/DEPLOYMENT.md
limitations: Notion imports require an authorized integration and cannot preserve database views; unsupported formulas retain their values as text. Offline editing covers previously opened pages. Not a drop-in replacement for Notion's hosted service or API. Production maturity is not explicitly documented.
