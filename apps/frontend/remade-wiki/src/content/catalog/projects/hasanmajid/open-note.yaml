slug: open-note
name: OpenNote
authors: [hasanmajid]
repository: https://github.com/HasanMajid/open-note
originals: [microsoft-onenote, samsung-notes]
category: productivity
languages: [Dart]
status: experimental
compatibility: partial
summary: "A Flutter notebook with Samsung Notes-style handwriting and OneNote-style organization."
description: "A Flutter notebook targeting Samsung Notes-style inking and OneNote-style organization. Provides pressure-sensitive pens, highlighting, stylus erasing, lasso transformations, undo/redo, rich text and notebook/section/page organization. Stores native notes as JSON-based documents, uses browser preferences for web persistence, and includes document import/export and PDF rendering."
license: "MIT"
docs: https://github.com/HasanMajid/open-note/blob/main/docs/ROADMAP.md
limitations: "Early implementation; native OneNote and Samsung Notes document compatibility and cross-platform behavior are not established. Browser storage and native saves can fall back to an in-memory cache on failure. Full media/PDF annotation and synchronization compatibility are not documented."
