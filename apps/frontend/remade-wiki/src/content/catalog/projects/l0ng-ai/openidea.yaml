description: A native desktop IDE targeting IntelliJ IDEA workflows with a Rust core and TypeScript interface. Provides
  familiar keymaps, tool windows, search everywhere, code insight, debugging, Git and an integrated terminal. Includes
  database browsing and SQL consoles, an HTTP client with Spring endpoint discovery, and language tooling across
  more than 60 languages. Extensible through WebAssembly plugins, themes and language integrations.
