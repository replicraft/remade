summary: "Search Fab assets from a Rust CLI, with a Quixel Bridge-style desktop asset manager planned."
description: "An independent Quixel Bridge-style asset workflow targeting Fab and Megascans. Its Rust CLI searches Fab and signs in to user accounts, with implemented download-queue and chunk-reassembly components, a SQLite library for offline browsing of downloaded assets, and a Blender PBR export adapter. Complete live downloads still need signed-in CDN validation; the desktop application and in-Blender add-on remain planned."
license: MIT OR Apache-2.0
docs: https://github.com/cmspeedau/AssetCraft#readme
limitations: "Pre-alpha; no desktop UI or Blender add-on yet. Download components and export adapters are implemented, but Fab CDN resolution still needs a real signed-in response and end-to-end download validation. OS keyring integration is unfinished. Account access and asset use depend on Fab and each asset license; the software license grants no rights to downloaded assets."
