summary: "Search Fab assets from a Rust CLI, with a Quixel Bridge-style desktop asset manager planned."
description: An independent Quixel Bridge-style asset workflow targeting Fab and Megascans. Its Rust CLI and egui desktop app search Fab, sign in, download owned assets and manage a local SQLite library. Resolves manifests, reassembles chunks and verifies files. Exports recorded assets as Blender PBR layouts and import scripts, with offline export and a Blender sidebar add-on.
license: MIT OR Apache-2.0
docs: https://github.com/cmspeedau/AssetCraft#readme
limitations: Pre-alpha; no installers yet. Fab access requires an authorized account and owned assets; service behavior and end-to-end compatibility remain maintainer-reported. Credentials use the OS keyring when available, otherwise an owner-only private file. Other DCC integrations, broader Fab coverage and polish remain unfinished.
