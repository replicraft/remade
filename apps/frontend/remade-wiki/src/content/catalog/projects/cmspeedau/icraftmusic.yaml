slug: icraftmusic
name: iCraftMusic
authors: [cmspeedau]
repository: https://github.com/cmspeedau/iCraftMusic
originals: [apple-itunes]
category: creative
languages: [Rust]
platforms: [Linux]
status: experimental
compatibility: partial
summary: "An iTunes-style local music player with album artwork, playlists, a queue and metadata editing."
description: "A native Rust player reproducing classic iTunes-style local music-library workflows, with album artwork, playlists, a playback queue, search, metadata editing and persistent settings. Uses iTunes 7 as its visual reference."
license: MIT
docs: https://github.com/cmspeedau/iCraftMusic#readme
limitations: "Linux AppImage releases are available. Accessibility support is maintainer-reported. Broader media and device workflows remain incomplete; native iTunes library compatibility is not documented. Codec recognition does not establish playback support for every file."
