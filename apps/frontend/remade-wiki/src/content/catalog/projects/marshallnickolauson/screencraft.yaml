# Scope and limitations are maintainer-reported in the README.
slug: screencraft
name: ScreenCraft
authors: [marshallnickolauson]
repository: https://github.com/MarshallNickolauson/ScreenCraft
originals: [screen-studio]
category: creative
languages: [Rust, JavaScript]
platforms: [macOS, Windows]
status: alpha
compatibility: partial
description: An independent Screen Studio-style recorder and editor with cursor-following automatic zooms, camera layouts, annotations, captions, speed ramps and transitions. Uses a Rust core and native capture backends, with local editing and video export.
license: MIT
website: https://screencraft.mdnlabs.dev/
docs: https://github.com/MarshallNickolauson/ScreenCraft#readme
limitations: Early alpha; native Screen Studio project compatibility is not documented. macOS and Windows only; installers are unsigned or not notarized. Windows lacks the standalone compressor. Caret tracking depends on application accessibility support. Preview proxies consume substantial disk space; captions require a model download.
summary: "Record and edit screens with automatic zooms, camera layouts, annotations and on-device captions."
