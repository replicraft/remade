summary: Tempo-synchronized volume shaping with editable curves, presets, mix and timing controls.
description: A JUCE-based volume-shaping effect targeting Kickstart-style rhythmic ducking without an external kick signal. Synchronizes to host tempo and meter, with editable envelope points, factory shapes, waveform display, mix/rate/offset controls and saved presets. Builds as VST3 and standalone applications, plus Audio Unit on macOS.
