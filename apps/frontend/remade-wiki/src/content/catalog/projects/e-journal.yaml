description: A local-first notebook implementing Microsoft Journal-style handwriting workflows with
  pressure-sensitive ink, highlighters, images and notebook organization. Imports Journal INK files
  read-only and exports its own portable library archive.
license: MIT
docs: https://github.com/EkarinLB/e-journal#readme
limitations: Beta; Journal INK import is partial and currently relies on page snapshots, with some
  files importing blank. Stroke-blob decoding is unfinished. PDF/PNG ink export is not implemented.
  Windows binaries are unsigned; Linux uses WebKitGTK.
summary: "A local handwriting notebook with pressure-sensitive ink, highlighters and Microsoft Journal INK import."
