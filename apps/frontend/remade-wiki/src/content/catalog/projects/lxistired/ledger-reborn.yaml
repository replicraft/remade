limitations: Preview for one user, one machine and USD. Payroll, tax filing, live banking, payments,
  multicurrency and complete QuickBooks migration are absent. Report comparisons do not establish
  complete accounting compatibility. Cash-basis output has limited validation. Desktop packages are
  unsigned.
summary: "QuickBooks-style desktop bookkeeping with a local ledger, invoices, bills, inventory and reconciliation."
