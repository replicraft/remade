slug: open-note
name: OpenNote
repository: https://github.com/HasanMajid/open-note
originals: [microsoft-onenote, samsung-notes]
category: productivity
languages: [Dart]
status: experimental
compatibility: partial
description: A Flutter notebook targeting Samsung Notes-style inking and OneNote-style organization. Implements pressure-sensitive pens, highlighters, stylus erasing, palm rejection, stroke and area erasers, lasso transformations and undo/redo. Native storage saves pages in its own JSON-based format.
license: Unlicensed
docs: https://github.com/HasanMajid/open-note/blob/main/docs/ROADMAP.md
limitations: Early implementation; rich text, full notebook/section hierarchy, media and PDF annotation, portable export and sync remain planned. Native OneNote and Samsung Notes document compatibility is not documented. Browser storage is an in-memory cache; platform behavior is unverified. No project-level license grant is documented.
summary: "A Flutter notebook with Samsung Notes-style handwriting and OneNote-style organization."
