summary: Animate-style 2D drawing and animation with symbols, tweening, bone rigging, media tracks and partial FLA
  exchange.
description: A Rust 2D animation application targeting Adobe Animate-style frame-by-frame drawing, motion tweening
  and reusable graphic symbols. Provides vector/raster tools, pressure-sensitive tablet input, bone rigging and
  Puppet deformation, animation clips, scenes, cameras, layer depth and dedicated media tracks. Imports supported
  ZIP/XFL-based FLA content, with native projects and GIF/video export.
license: MIT
docs: https://github.com/alvillafm/LibreToon#readme
limitations: 'Experimental. FLA interchange is partial: scripts are not executed, and imported audio, video, bitmap
  fills, some masks/effects and unsupported tweening are omitted or approximated with warnings. Pre-CS5 binary FLA
  is unsupported. Typography and timing can differ; no real user-file collection has been validated. Large FLA saves
  can block the interface.'
