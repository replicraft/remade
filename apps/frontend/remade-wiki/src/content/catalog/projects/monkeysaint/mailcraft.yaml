slug: mailcraft
name: MailCraft
authors: [monkeysaint]
repository: https://github.com/MonkeySaint/mailcraft
browser_url: https://playground.daijro.dev/mailcraft/
originals: [microsoft-outlook]
category: productivity
languages: [Rust]
platforms: [Linux, Windows, macOS, FreeBSD, Web]
status: experimental
compatibility: partial
description: MailCraft reproduces classic Outlook-style mail, calendar, contacts, tasks and notes workflows with a ribbon, reading pane, rules and quick steps. It supports standard mail protocols, local-first storage, common file formats and CLI/MCP automation.
license: MIT OR Apache-2.0
docs: https://github.com/MonkeySaint/mailcraft#readme
limitations: Pre-alpha; compatibility is maintainer-reported. Exchange EWS is unsupported. OAuth sign-in requires a provider-registered client ID. Without an OS credential store, account secrets fall back to an unencrypted local file.
summary: "An Outlook-style email client with familiar mail organization and desktop workflows."
