slug: firecraft
name: FireCraft
authors: [aliasfoxkde]
repository: https://github.com/aliasfoxkde/FireCraft
originals: [adobe-fireworks]
category: creative
languages: [Rust]
status: experimental
compatibility: partial
description: An independent implementation targeting Fireworks CS6 document and scripting workflows. Provides Fireworks PNG reading and writing, vector and bitmap operations, text, symbols, a CPU compositor and JSF scripting commands. Offers a browser build, desktop releases and CLI tools for document and image conversion.
license: MIT OR Apache-2.0
docs: https://github.com/aliasfoxkde/FireCraft/blob/main/docs/PROGRESS.md
limitations: File round-trip and scripting fidelity are maintainer-reported, not independently verified across arbitrary Fireworks documents. The progress matrix records partial commands and outstanding behavior differences; full CS6 application parity is not established. Some image formats and WebOS packaging remain in development.
website: https://firecraft-web.pages.dev
