slug: openmailclient
name: OpenMailClient
authors: [adriaanboshoff]
repository: https://github.com/AdriaanBoshoff/OpenMailClient
originals: [microsoft-outlook]
category: productivity
languages: [Rust]
platforms: [Windows, Linux]
status: "alpha"
compatibility: partial
description: "Independent Outlook Classic-style mail client with a ribbon, folder panes, formatted message reading and composition. Reads PST, OST, MSG, OFT and EML, writes PST and individual messages, and supports IMAP, POP3 and SMTP accounts. Includes recurring calendars, contacts and tasks with CalDAV/CardDAV synchronization, plus a CLI and PDF printing."
license: MIT OR Apache-2.0
website: https://adriaanboshoff.github.io/OpenMailClient/
docs: https://github.com/AdriaanBoshoff/OpenMailClient/blob/main/docs/gaps.md
limitations: "Alpha; compatibility is maintainer-reported. MCP and browser builds are planned. OST is read-only; saving into Outlook-authored PST files remains unverified. Some text layout differs. Windows installers are unsigned; published Linux builds target x64."
summary: "Outlook-style email with a ribbon interface, PST/OST files, IMAP, POP3, SMTP and command-line tools."
