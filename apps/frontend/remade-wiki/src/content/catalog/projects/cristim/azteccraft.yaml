authors: [cristim]
repository: https://github.com/cristim/AztecCraft
originals: [autodesk-maya]
category: creative
languages: [Rust]
status: experimental
compatibility: targeting
summary: "An early Maya-style 3D editor with primitives, transforms, undo/redo and perspective navigation."
description: "A Rust desktop prototype targeting Maya's interface and behavior. Offers primitive creation, selection, transforms, undo/redo and perspective navigation, with bounded Maya binary scene decoding and provisional Unix and Windows writing for supported existing records. Library APIs provide single-face extrusion and OBJ export; optional MCP controls a new editor window."
license: MIT OR Apache-2.0
docs: https://github.com/cristim/AztecCraft#current-capabilities
limitations: Provisional Maya binary Save/Save As for existing records on Unix/Windows needs native QA. Maya ASCII and structural rewriting are unsupported. GUI export is unfinished; extrusion covers one face by thickness, without a manipulator. Animation, rigging, UVs, rendering, scripting and plug-ins are planned. Maya coverage is unmeasured; cross-platform launch checks remain incomplete.
