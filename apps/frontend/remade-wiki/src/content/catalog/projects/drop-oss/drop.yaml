# Broader Steam library/distribution alternative included at maintainer request.
slug: "drop"
name: "Drop"
authors: ["drop-oss"]
repository: "https://github.com/Drop-OSS/drop"
originals: ["steam"]
category: "games"
languages: ["TypeScript", "Rust"]
platforms: ["Windows", "Linux", "macOS", "Web"]
status: "experimental"
compatibility: "partial"
summary: "Self-host a Steam-style library to browse, distribute, install and launch your own DRM-free games."
description: "A self-hosted game-distribution platform with a library storefront, metadata imports, user accounts and a desktop client for downloading, installing and launching operator-supplied DRM-free games. Reimplements a subset of Steam-style library and distribution workflows on infrastructure the operator controls."
license: "AGPL-3.0"
docs: "https://github.com/Drop-OSS/drop#readme"
limitations: "A broader alternative, not a compatible Steam client or replacement for Valve accounts, DRM, purchases, Workshop or multiplayer services. Requires a self-hosted server and separately supplied games. Upstream is in maintenance mode with bug fixes and external contributions still accepted; client packages vary by platform."
website: "https://droposs.org/"
