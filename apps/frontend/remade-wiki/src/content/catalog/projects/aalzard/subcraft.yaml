# Scope and limitations are maintainer-reported in the repository documentation.
slug: subcraft
name: SubCraft
authors: [aalzard]
repository: https://github.com/Aalzard/subcraft
originals: [adobe-substance-3d-painter]
category: creative
languages: [Rust]
platforms: [Windows, Linux]
status: experimental
compatibility: partial
description: An independent Painter-style 3D texture painting application with layered PBR materials, masks, generators, smart materials, mesh-map baking and game-engine export presets. Imports OBJ, glTF and FBX and saves its own project format.
license: MIT OR Apache-2.0
docs: https://github.com/Aalzard/subcraft#readme
limitations: Early but usable, with breaking project-format changes possible. Painter project compatibility is not documented. SBSAR materials cannot be read directly; exported texture maps can be imported instead. Some painting and export workflows remain incomplete. Windows binaries are unsigned.
summary: "Painter-style 3D texture painting with PBR layers, masks, mesh baking and game-engine exports."
