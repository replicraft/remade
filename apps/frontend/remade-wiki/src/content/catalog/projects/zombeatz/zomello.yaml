summary: Trello and Microsoft Planner-style boards with offline tasks, import, calendar and timeline views, and optional self-hosted collaboration.
description: A local-first kanban planner targeting Trello and Microsoft Planner workflows. Boards and cards support checklists, labels, recurring tasks, attachments, linked tasks, custom fields and time tracking. Includes board, list, calendar, timeline and chart views, plus My Day. Imports Trello JSON and Planner XLSX/CSV; shares portable .zomello board files. Use it offline without an account or collaborate on shared boards with live updates through an optional self-hosted server.
license: MIT
docs: https://docs.zombeatzmedia.com/zomello/
limitations: Does not replace Trello or Planner services or APIs, or export their formats. Trello uploads remain links; older comments and Planner fields absent from exports may be missing. The hosted demo stores changes only in your browser. macOS downloads are server-only; no native macOS or public iOS app release. Current source includes changes newer than the v0.5.0 prerelease.
