summary: Trello and Microsoft Planner-style boards with offline tasks, import, calendar and timeline views, and optional self-hosted collaboration.
description: A kanban planner with boards, buckets and cards, labels, checklists, priorities, progress, due dates and repeats, attachments, linked tasks, custom fields and time tracking. Includes board, list, calendar, timeline and chart views and My Day. Imports Trello JSON and Microsoft Planner XLSX/CSV exports; shares portable .zomello board files. Runs offline on your device without an account, or supports shared boards and live collaboration through an optional self-hosted server.
license: MIT
website: https://docs.zombeatzmedia.com/zomello/
docs: https://docs.zombeatzmedia.com/zomello/
limitations: Does not replace Trello or Planner services or APIs, or export their formats. Trello uploads remain links; older comments and Planner fields absent from exports may be missing. The hosted demo stores changes only in your browser. macOS downloads are server-only; no native macOS or public iOS app release.
