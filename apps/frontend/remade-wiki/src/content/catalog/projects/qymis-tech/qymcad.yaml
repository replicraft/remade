summary: Fusion-style parametric sketches, solid features, editable history and mechanical assemblies.
description: A desktop parametric CAD application targeting sketch-to-part-to-assembly workflows associated with Autodesk Fusion. Uses OpenCASCADE BREP geometry for constrained sketches, extrude/revolve/sweep/loft, holes, fillets, shells and patterns, with joints and dependent history regeneration. Exchanges standard CAD geometry through STEP.
license: AGPL-3.0-or-later
website: https://cad.qymis.tech/
docs: https://github.com/QymIs-Tech/QymCAD#readme
limitations: Development builds change their project format without backward compatibility; older files may require conversion. The CAM module is nonfunctional groundwork. Fusion project/cloud/add-in compatibility is not established. macOS builds are not Apple-signed; Linux packages require glibc 2.35 or later.
