summary: Scrivener-style novel writing with chapter outlines, storyboards, research notes and publishing exports.
description: A novel-writing alternative targeting Scrivener-style organization and publishing workflows. Built with Tauri, Svelte and TypeScript, it combines chapter and scene organization, outlines, storyboarding, rich-text editing, character/place templates and research notes. Exports include PDF, DOCX, EPUB, Markdown, HTML and plain text.
limitations: Scrivener project import/export and full compile compatibility are not established. Timeline, front/back matter and several writing modes remain planned. MIT is declared in package.json; no standalone license file was found.
