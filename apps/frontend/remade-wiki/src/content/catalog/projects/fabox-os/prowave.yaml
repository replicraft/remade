description: An independent Logic Pro-style digital audio workstation built with Rust and egui. Provides audio and MIDI regions, piano-roll editing with quantization and velocity controls, a mixer, tempo maps, a built-in synthesizer and streamed audio playback. Saves arrangements and media in its own .prowave project format.
license: GPL-3.0-or-later
docs: https://github.com/fabox-os/Pro-Wave#readme
discord_server: https://discord.gg/V5m5nnP9uB
limitations: Early development. Recording, undo/redo, effects processing and most Logic instruments remain planned. Mixer controls do not establish complete effects or routing support. Logic Pro .logicx project compatibility is not established. Upstream reports Windows use; Linux and macOS packages have not been tested on real hardware. Builds are unsigned or ad-hoc signed and not notarized.
summary: Logic Pro-style audio and MIDI arrangement, piano-roll editing, mixing and synthesis in a Rust desktop app.
