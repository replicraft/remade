slug: picasso-suite
name: Picasso Suite
authors: [fabox-os]
repository: https://github.com/fabox-os/Picasso-Suite
originals: [davinci-resolve]
category: creative
languages: [Rust]
platforms: [Windows, Linux, macOS]
status: experimental
compatibility: partial
summary: "Resolve-style video editing with multi-track timelines, node-based color grading, audio mixing and FFmpeg export."
description: "A Rust video editor targeting DaVinci Resolve workflows across Media, Cut, Edit, Fusion, Color, Fairlight and Deliver pages. Includes multi-track trimming, multicam, keyframes, titles, node-based grading, scopes, audio recording and mixing, and an FFmpeg render queue. Reads Resolve project settings and media references, saves its own projects, and exchanges timelines through XML, AAF, OpenTimelineIO and EDL."
license: GPL-3.0-or-later
docs: https://github.com/fabox-os/Picasso-Suite#readme
limitations: "Early software. Resolve imports recover settings and media, not timeline clip placement. OFX/.drfx, advanced masks/tracking and ADR remain planned. AAF/XML interchange has not been tested in the target editors. GPU/encoder coverage is limited; macOS 15+ packages are unsigned. Linux normally uses XWayland because native Wayland drag-and-drop is unsupported."
