slug: downloadcraft
name: DownloadCraft
authors: [hungry-detective]
repository: https://github.com/hungry-detective/downloadcraft
originals: [internet-download-manager]
category: productivity
languages:
  - Rust
platforms:
  - Windows
status: experimental
compatibility: targeting
summary: "An offline-first download manager with segmented transfers, resume, queues, scheduling and browser integration."
description: Independent offline-first download manager with segmented multi-connection downloads, resume via HTTP Range, queue with scheduler, speed limit, browser native-messaging integration, clipboard monitoring, and egui GUI plus CLI.
license: MIT
docs: https://github.com/hungry-detective/downloadcraft#readme
limitations: Early Windows application. Full IDM behavior, settings and browser-integration compatibility are not established. Browser support uses its own unpacked extension and native-messaging host, which must be installed separately. Segmented resume depends on server support for HTTP Range requests.
