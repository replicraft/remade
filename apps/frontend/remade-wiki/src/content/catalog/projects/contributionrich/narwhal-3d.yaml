originals: [rhino3d]
category: engineering
languages: [Python, C++]
platforms: [Linux, Windows, macOS]
status: experimental
compatibility: partial
description: An independently developed, command-driven NURBS CAD application with four-view modeling, exact solid geometry, layers, object snaps, manufacturing-oriented export, and a growing command interface.
license: GPL-3.0-or-later
limitations: "Early previews; many commands, panels and rendering features remain incomplete. Uses a patched open-source Blender runtime and Open CASCADE. Windows builds are unsigned with limited physical-GPU testing. macOS packages target Apple Silicon on macOS 14 or later and are not notarized. Some exact solid .3dm exports need additional components; Corel multiversion conversion is unavailable on Mac."
summary: "Rhino-style NURBS CAD with exact solid geometry, four-view modeling, snaps and manufacturing exports."
