# Broader Wilcom alternative included with maintainer approval.
slug: stitchfoundry
name: StitchFoundry
authors: [sitesentrix]
repository: https://github.com/StitchFoundry/StitchFoundry
browser_url: https://stitchfoundry.github.io/StitchFoundry/
originals: [wilcom-embroiderystudio]
category: creative
languages: [Rust]
platforms: [Windows, macOS, Linux, FreeBSD, Web]
status: experimental
compatibility: partial
summary: "Wilcom-style embroidery digitizing with stitch generators, applique, lettering and machine-file exports."
description: A Wilcom EmbroideryStudio-style digitizing application built on VectorCraft, with running, satin and fill stitches, applique, automatic stitch sequencing, lettering, design checks and embroidery-file import/export. Includes stitch previews and headless automation.
license: MIT OR Apache-2.0
docs: https://github.com/StitchFoundry/StitchFoundry#readme
limitations: "Pre-release with downloadable release-candidate builds. A broader Wilcom alternative built on VectorCraft; native Wilcom project-file compatibility is not documented. Machine files have been checked in software but not sewn on real hardware. Browser builds cannot download embroidery fonts. AI-assisted artwork generation requires a separate Anthropic API key."
