description: A Rust non-linear editor targeting Vegas-style track and event workflows. Provides audio/video timelines, envelopes, keyframes and effects at media, event, track and output levels, with customizable keyboard operation and dockable workspaces. Uses Media Foundation on Windows and FFmpeg on Linux for supported media pipelines.
