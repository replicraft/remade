summary: Vegas-style track editing with audio/video events, envelopes, effects, preview and rendering.
description: A Rust non-linear editor targeting Vegas-style track and event workflows. Provides audio/video timelines,
  envelopes, keyframes and effects at media, event, track and output levels, plus OpenFX/VST3 hosting, color correction
  and LUTs. Imports supported .veg project data and uses its own project format, with Media Foundation on Windows
  and FFmpeg on Linux.
