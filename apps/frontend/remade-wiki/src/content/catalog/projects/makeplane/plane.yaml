originals: [jira, linear, monday, clickup]
category: productivity
languages: [TypeScript, Python]
platforms: [Web]
status: stable
compatibility: partial
summary: "Manage tasks, boards, sprints and documentation with Jira-, Linear- and ClickUp-style workflows."
description: Plane provides familiar Jira, Linear, monday.com and ClickUp-style project management workflows, with work items, boards, cycles, modules, customizable views, documentation and analytics. Its open-source Community Edition can be self-hosted.
license: AGPL-3.0-only
