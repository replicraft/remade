slug: "oxybrush"
name: "OxyBrush"
authors: ["crisprintsstuff"]
repository: "https://github.com/crisprintsstuff/OxyBrush"
originals: ["zbrush"]
category: "creative"
languages: ["Rust"]
platforms: ["Windows", "Linux", "macOS"]
status: "alpha"
compatibility: "partial"
summary: "ZBrush-style digital sculpting with brushes, subdivision levels, voxel remeshing and OBJ/STL exchange."
description: "A digital-clay sculpting application with pressure-sensitive brushes, masking, symmetry, multi-piece scenes, subdivision levels, voxel remeshing, decimation and face groups. Saves its own OXB projects with autosave/recovery and imports or exports OBJ and STL geometry."
license: "MIT OR Apache-2.0"
docs: "https://github.com/crisprintsstuff/OxyBrush#readme"
limitations: "Alpha; native ZBrush file interoperability is research, not shipped support. Dynamic topology, vertex color, sculpt layers, posing, UVs and baking remain planned. Tablet pressure and high-poly performance need qualification. Windows builds are unsigned and macOS packages are not notarized; iPad is planned."
screenshots:
