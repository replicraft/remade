status: experimental
compatibility: partial
summary: Inventor-style parametric CAD with constrained sketches, solid features, holes and threads.
description: An offline parametric CAD application targeting Autodesk Inventor-style modeling workflows. Built in C++ on OpenCASCADE, it combines a ribbon interface and feature tree with constrained sketches, extrusion, revolution, holes and threads. Documents desktop builds and an Android edition, plus keyboard and mouse presets for Inventor users.
license: MPL-2.0
docs: https://github.com/BreezeCAD/breezecad#readme
limitations: Early preview; full Inventor feature coverage and native IPT/IAM project round-trip compatibility are not established. Platform support and Android stability are maintainer-reported, with Windows described as the main platform.
