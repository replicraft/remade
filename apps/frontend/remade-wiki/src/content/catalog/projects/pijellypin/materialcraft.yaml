limitations: "Upstream currently describes the project as early alpha. SBS interoperability and node coverage are maintainer-reported, not full Designer compatibility. The roadmap still lists end-to-end workflow completion, MaterialX export, downstream engine qualification, and Android/Web deployment as unfinished."
