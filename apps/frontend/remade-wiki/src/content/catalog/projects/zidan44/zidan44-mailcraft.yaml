# This upstream is distinct from MonkeySaint/mailcraft; scope and gaps are maintainer-reported.
slug: zidan44-mailcraft
name: MailCraft
authors: [zidan44]
repository: https://github.com/ZIDAN44/mailcraft
originals: [microsoft-outlook]
category: productivity
languages: [Rust]
platforms: [Windows, macOS, Linux, Web]
status: experimental
compatibility: partial
description: An independent Outlook-style mail client with local caching, offline search, threaded reading, composition, rules and account management. Supports IMAP/SMTP, JMAP and Exchange workflows, calendar and contacts, PST import and mail export, plus a CLI. A browser build handles JMAP accounts.
license: MIT OR Apache-2.0
docs: https://github.com/ZIDAN44/mailcraft/blob/main/docs/gaps.md
limitations: Browser accounts require JMAP and server CORS support. PST export writes mail only, omitting some item types and metadata. Kerberos-only Exchange and ActiveSync are unsupported. HTML positioning and background images differ; mixed-direction editing and native Wayland attachment dragging have gaps. Full Outlook compatibility is not claimed.
summary: "Outlook-style email with offline search, local caching, threaded messages, rules and account management."
