docs: https://github.com/VibeDarling/darling#readme
limitations: Experimental compatibility depends on application version, architecture, frameworks
  and runtime revision. Installing an application or opening a window does not establish working
  workflows. It is a Linux compatibility layer, not a full macOS replacement; bundled components
  retain separate licenses.
summary: "A Darling development fork working to run macOS applications on Linux without a virtual machine."
