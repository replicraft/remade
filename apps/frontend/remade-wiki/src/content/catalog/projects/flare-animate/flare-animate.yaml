# Planned status reflects Remade maintainer review; implementation goals come from upstream.
slug: flare-animate
name: Flare
authors: [flare-animate]
repository: https://github.com/Flare-Animate/Flare
website: https://flare-animate.github.io/website/
originals: [adobe-animate]
category: creative
languages: [C++, Rust, Python]
platforms: [Linux, macOS, Windows]
status: alpha
compatibility: partial
description: An Animate-style animation application based on OpenToonz, with vector and raster drawing, timelines, rigging and effects. Imports Flash/Animate containers through native readers and offers optional Next2Flash tooling for SWF round-trips and ActionScript decompilation. Moho import reads structure, rigs and asset manifests.
license: BSD-3-Clause
docs: https://github.com/Flare-Animate/Flare#readme
limitations: Very early alpha; import fidelity is incomplete. OpenToonz-derived, with separate third-party licenses. Flash's merge-drawing model and Moho rig rendering are not implemented. Game creation and Android builds are scaffolds; P2P remote control has no transport. Features are maintainer-reported.
