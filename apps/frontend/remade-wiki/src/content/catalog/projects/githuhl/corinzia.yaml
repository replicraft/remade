# The author identifies Dorico, Sibelius and Finale in https://github.com/replicraft/remade/issues/48.
slug: corinzia
name: Corinzia
authors: [githuhl]
repository: https://github.com/GitHuhl/Corinzia
originals: [steinberg-dorico, avid-sibelius, finale]
category: creative
languages: [Rust]
platforms: [Linux, Windows]
status: experimental
compatibility: partial
description: A broader Dorico, Sibelius and Finale alternative combining notation and DAW workflows. Its Rust engraver provides scores and parts, note entry, lyrics and chord symbols. Hosts CLAP and VST3 instruments, imports MusicXML and exports PDF, MIDI and MusicXML, with an arrange view and mixer.
license: MIT
docs: https://github.com/GitHuhl/Corinzia/blob/main/docs/ARCHITECTURE.md
limitations: Pre-alpha; native Dorico/Sibelius/Finale compatibility is undocumented. Bus routing, plug-in delay compensation, automation playback and saving plug-in settings are unfinished. README sections conflict on project saving. Linux audio needs PipeWire. MIT workspace metadata conflicts with an AGPL-3.0 LICENSE; upstream clarification is needed.
