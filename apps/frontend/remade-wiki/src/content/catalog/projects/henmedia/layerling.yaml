summary: Tinkercad-style shape modeling with fillets, threads, sketches and CAD exchange for 3D printing.
description: A local-first browser CAD editor derived from SketchForge-3D. Reproduces Tinkercad-style shape placement, solid/hole grouping, alignment and workplane interactions, adding OpenCASCADE-backed edge operations, shelling, sketches, threads, patterns and STEP/STL/3MF exchange. Designs remain in browser storage or a self-hosted project store; local MCP control is available.
license: AGPL-3.0-only
website: https://layerling.com/
browser_url: https://layerling.com/
docs: https://github.com/henmedia/layerling#readme
limitations: 'Not a full parametric CAD package: no parametric feature timeline or assemblies. Tinkercad cloud/account compatibility is not established. A community Tinkercad conversion tool is separate and untested by the maintainer. Browser storage requires explicit backups/export.'
