summary: An early Rust schematic and PCB editor following KiCad workflows, listed as a broader Altium alternative.
description: A broader Altium Designer alternative built in Rust around KiCad-style workflows. Provides desktop and browser schematic editing, hierarchical sheets, symbols, wires and shared undo/redo. The PCB workspace supports board edges, footprint inspection, placement and rotation. Includes symbol and footprint editors, portable project archives, CLI/MCP control and a desktop AI assistant.
license: MIT OR Apache-2.0
docs: https://github.com/tangency-labs/pcbcraft#readme
limitations: Early development; targets familiar KiCad workflows rather than Altium file, interface or API compatibility. Routing, full ERC/DRC and fabrication output are planned. The current source does not establish the earlier listing's KiCad board-export or production layout claims. Platform and end-to-end workflow coverage remain limited.
