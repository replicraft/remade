summary: SketchUp-style push/pull modeling with precise woodworking dimensions, cut lists and sheet layouts.
description: A local-first modeler targeting SketchUp-style push/pull, inference snapping, familiar keys, groups/components, tags and scenes. Adds woodworking cut lists, material layouts and manufacturing exports. Imports supported SketchUp SKP models through the independent openskp library, plus common mesh/vector formats, in browser and desktop builds.
