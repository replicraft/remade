# Scope and limitations are maintainer-reported in the repository README.
slug: simcraft
name: SimCraft
authors: [nibrasaz7]
repository: https://github.com/NibrasAz7/simcraft
docs: https://github.com/NibrasAz7/simcraft#readme
originals: [matlab]
category: engineering
languages: [Rust]
platforms: [Windows]
status: alpha
compatibility: partial
description: An independent Rust block-diagram simulator targeting Simulink-class workflows, with a typed-signal kernel (algebraic-loop detection, fixed-step Euler/RK4), a 20-block library, a .simcraft JSON model format, a headless CLI, and an engine layer that links to MatCraft for workspace interop.
license: MIT OR Apache-2.0
limitations: Alpha; compatibility is maintainer-reported. Only fixed-step Euler and RK4 solvers (no variable-step or event/ODE solvers), a 20-block library, and JSON models are implemented. .slx/.mdl import, GUI diagram editor, variable-step and stiff solvers, sample-time colors, model references, and code generation are not yet implemented.
