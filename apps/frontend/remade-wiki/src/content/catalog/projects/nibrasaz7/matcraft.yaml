slug: matcraft
name: MatCraft
authors: [nibrasaz7]
repository: https://github.com/NibrasAz7/matcraft
originals: [matlab]
category: engineering
languages:
  - Rust
platforms:
  - Windows
status: alpha
compatibility: partial
description: >-
  Independent numerical computing environment targeting the MATLAB
  language: a native Rust interpreter for .m files with a column-major
  matrix core, ~280 builtins, complex and sparse matrices, 2D/3D plotting
  with SVG/PNG/PDF export, a MATLAB-style desktop Studio, .mat v5 file
  I/O, a CLI, and MCP/TCP automation channels.
license: MIT OR Apache-2.0
docs: https://github.com/NibrasAz7/matcraft/blob/master/docs/language.md
limitations: >-
  Alpha. No anonymous function handles (@), classdef OOP, N-D indexing,
  image I/O, or Simulink-style block modeling yet. In a sweep of 638
  real-world pre-2022 .m files across 8 domains, the maintainer reports ~87%
  parse cleanly; parsing does not establish execution compatibility.
  Methodology and ranked gaps are in docs/wild-corpus.md.
summary: "A MATLAB-style numerical environment with a Rust M-file interpreter, matrices and mathematical functions."
