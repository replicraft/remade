summary: "A MATLAB-style numerical environment with a Rust M-file interpreter, matrices and mathematical functions."
description: "A MATLAB-style numerical environment with a native Rust M-file interpreter, a column-major matrix core, complex and sparse matrices, cells, structs, anonymous functions, classdef classes, N-D arrays and numerical/DSP built-ins. Provides a MATLAB-style desktop Studio, CLI, MCP/TCP automation, 2D/3D plotting with SVG/PNG/PDF export and MAT v5 load/save."
license: MIT OR Apache-2.0
