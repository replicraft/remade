original: 3dcoat
reason: Reproduce 3DCoat's voxel and surface sculpting, stencils, retopology, UV editing and texture painting, extended to VR. Draw inspiration from Adobe Medium's stamps and sculpting tools and Substance 3D Modeler's grouping and workspace, without assuming those products already provide all requested features.
