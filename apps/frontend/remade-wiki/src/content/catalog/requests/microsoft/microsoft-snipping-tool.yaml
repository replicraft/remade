original: microsoft-snipping-tool
reason: Combine Snipping Tool's screenshot capture and annotation with Sticky Notes in one app. Add tags and search, and let users pin any note or tag to the desktop. Keep the UI clean, with a yellow top bar that expands to show the menu when the window is active and collapses when inactive.
suggested_names: [SnipNoteCraft]
summary: "Wanted: Combine Snipping Tool's screenshot capture and annotation with Sticky Notes in one app."
