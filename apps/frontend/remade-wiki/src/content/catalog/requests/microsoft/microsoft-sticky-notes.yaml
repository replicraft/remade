original: microsoft-sticky-notes
reason: Combine Sticky Notes' desktop notes with Snipping Tool's screenshot capture and annotation in one app. Add tags and search, and let users pin any note or tag to the desktop. Keep the UI clean, with a yellow top bar that expands to show the menu when the window is active and collapses when inactive.
suggested_names: [SnipNoteCraft]
summary: "Wanted: Combine Sticky Notes' desktop notes with Snipping Tool's screenshot capture and annotation in one app."
