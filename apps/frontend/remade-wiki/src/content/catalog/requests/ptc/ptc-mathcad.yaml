reason: Reproduce Mathcad's engineering worksheets with readable mathematical notation, unit checking and conversion, numerical and symbolic calculations, plots, annotations and compatible worksheet workflows. MathCraft could combine these features with MATLAB scripting and Simulink modeling in one application.
