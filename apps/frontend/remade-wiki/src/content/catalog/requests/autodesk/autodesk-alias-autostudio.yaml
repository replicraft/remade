original: autodesk-alias-autostudio
summary: "Wanted: Alias-style automotive and industrial design workflows."
reason: Reproduce Alias AutoStudio's automotive and industrial design workflow, including curve modeling, NURBS and subdivision surfaces, Class-A surfacing, continuity analysis and compatible model exchange. Prioritize native macOS support for users who miss Alias Studio on Mac and want an open-source Class-A surface modeler.
