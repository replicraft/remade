original: rekordbox
reason: Reproduce Rekordbox's track organization, set preparation, cue points, beat grids, performance and device-export workflows with compatible libraries. DJCraft should combine Serato DJ, Traktor Pro and Rekordbox workflows in one application, preserving each target's familiar behavior and library interoperability. Mixxx (https://mixxx.org/) is an open-source inspiration.
suggested_names: [DJCraft]
summary: "Wanted: DJ-library organization, cue points, beat grids, set preparation and device exports."
