original: traktor-pro
summary: "Wanted: Traktor Pro's deck mixing, beat synchronization, cue points, loops and effects."
reason: Reproduce Traktor Pro's deck mixing, beat synchronization, cue points, loops and effects, with compatible prepared track libraries. DJCraft should combine Serato DJ, Traktor Pro and Rekordbox workflows in one application, preserving each target's familiar behavior and library interoperability. Mixxx (https://mixxx.org/) is an open-source inspiration.
suggested_names: [DJCraft]
