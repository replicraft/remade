slug: artcraft-launcher
name: ArtCraft Launcher
authors: [storytold]
repository: https://github.com/storytold/craft-launcher
url: https://github.com/storytold/craft-launcher
languages: [Rust]
platforms: [Windows, macOS, Linux, FreeBSD, Web]
status: alpha
license: MIT OR Apache-2.0
description: A native launcher for the Craft App Suite that discovers installed apps, selects release packages for the operating system and processor, verifies published SHA-256 checksums, and installs, updates and launches apps. Includes a tray interface, self-updates and a web catalog of downloads.
docs: https://github.com/storytold/craft-launcher#readme
limitations: Early alpha. App availability depends on upstream release assets and OS/CPU support. The web build browses downloads; native installation requires a desktop build. Sandboxed Linux installs have host-access limits. ArtCraft branding has separate terms from the source-code license.
suites: [artcraft]
summary: "Discover, download, verify and launch Craft Suite apps from a native desktop launcher."
