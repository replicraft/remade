name: App Build + Unit Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: App Build + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Always report this required check; skip compilation for unrelated changes.
      - name: Check frontend build inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          elif [ -n "$(git diff --name-only "$BASE_SHA" HEAD -- launcher.yaml apps/frontend/remade-wiki package.json pnpm-lock.yaml pnpm-workspace.yaml cache/github-metadata.json biome.jsonc .github/workflows/frontend-test.yml)" ]; then
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6.1.0
        if: steps.changes.outputs.frontend == 'true'
      - uses: actions/setup-node@v7.1.0
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.frontend == 'true'
      - name: Biome lint and formatting (advisory)
        run: pnpm exec biome check apps/frontend/remade-wiki
        continue-on-error: true
        if: steps.changes.outputs.frontend == 'true'
      - run: pnpm check
        if: steps.changes.outputs.frontend == 'true'
      - run: pnpm test:unit
        if: steps.changes.outputs.frontend == 'true'
      - run: pnpm build
        if: steps.changes.outputs.frontend == 'true'
      - name: Check generated internal links (advisory)
        if: steps.changes.outputs.frontend == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          output: lychee/internal-report.md
          args: --config lychee.toml --offline --verbose --no-progress --root-dir apps/frontend/remade-wiki/dist './apps/frontend/remade-wiki/dist/**/*.html'
          fail: true
      - name: Save internal link report
        if: always() && steps.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: internal-link-report
          path: lychee/internal-report.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify default Launcher gate and public feed
        if: steps.changes.outputs.frontend == 'true'
        run: pnpm --filter ./apps/frontend/remade-wiki exec node tests/build/launcher.mjs
      - name: Build explicitly enabled Launcher preview
        if: steps.changes.outputs.frontend == 'true'
        env:
          REMADE_LAUNCHER_ENABLED: 'true'
        run: |
          pnpm build
          pnpm --filter ./apps/frontend/remade-wiki exec node tests/build/launcher.mjs
