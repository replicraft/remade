name: Catalog and PR policy checks

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  catalog:
    name: Catalog integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.13.0'
          working-directory: scripts
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Lint and check Python formatting
        run: |
          uv run --project scripts ruff check scripts
          uv run --project scripts ruff format --check scripts
      - name: Check Python types
        run: uv run --project scripts ty check --project scripts
      - name: Validate catalog records and launcher allowlist
        run: uv run --project scripts python scripts/validate_catalog.py
      - name: Check policy acknowledgment in PR description
        if: github.event_name == 'pull_request'
        run: uv run --project scripts python scripts/check_pr_policy.py
      - name: Run catalog validation tests
        run: uv run --project scripts pytest scripts/tests -v
